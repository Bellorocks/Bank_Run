[package]
name = "deal-desk"
version = "0.1.0"
description = "DEAL DESK — Excel trainer gamificato per Investment Banking & Private Equity"
authors = ["Lorenzo Bellorini"]
edition = "2021"
rust-version = "1.77"

[lib]
# Il nome della lib e' referenziato da main.rs; su Windows serve anche cdylib per il bundling.
name = "deal_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
